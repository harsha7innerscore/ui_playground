<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 22px 24px;
        background: #111;
        color: #eee;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      p.sub {
        font-size: 12px;
        color: #999;
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #bbb;
        margin: 14px 0 4px;
      }
      input {
        width: 100%;
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1c1c1c;
        color: #fff;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > div {
        flex: 1;
      }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #2fa8ff;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Water Reminder Settings</h1>
    <p class="sub" id="subtitle">Tune how and when Neo nudges you.</p>
    <form id="f">
      <label for="name">Your name (optional)</label>
      <input id="name" type="text" maxlength="40" placeholder="e.g. Harsha" />

      <label for="intervalMin">Reminder every (minutes)</label>
      <input id="intervalMin" type="number" min="1" max="720" />

      <label>Active hours</label>
      <div class="row">
        <div>
          <input id="activeStartHour" type="number" min="0" max="23" title="Start hour (0-23)" />
        </div>
        <div>
          <input id="activeEndHour" type="number" min="1" max="24" title="End hour (0-24)" />
        </div>
      </div>

      <label for="snoozeMin">Snooze length (minutes)</label>
      <input id="snoozeMin" type="number" min="1" max="120" />

      <button type="submit">Save</button>
    </form>
    <script src="settings.js"></script>
  </body>
</html>
